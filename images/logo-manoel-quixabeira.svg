<svg width="1200" height="1200" viewBox="0 0 680 680" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Logo Manoel Quixabeira Nutricionista</title>
  <desc>Logo vetorial com monograma MQ dourado sobre fundo preto</desc>

  <rect width="680" height="680" fill="#0a0a0a"/>

  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8d49a"/>
      <stop offset="40%" stop-color="#c8a96e"/>
      <stop offset="100%" stop-color="#a07840"/>
    </linearGradient>
    <linearGradient id="goldV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8d49a"/>
      <stop offset="50%" stop-color="#c8a96e"/>
      <stop offset="100%" stop-color="#b08850"/>
    </linearGradient>
  </defs>

  <!-- M glyph -->
  <rect x="178" y="170" width="18" height="200" fill="url(#goldV)" rx="1"/>
  <rect x="330" y="170" width="18" height="200" fill="url(#goldV)" rx="1"/>
  <polygon points="178,170 196,170 263,295 245,295" fill="url(#gold)"/>
  <polygon points="245,295 263,295 348,170 330,170" fill="url(#gold)"/>

  <!-- Q glyph -->
  <circle cx="448" cy="268" r="105" fill="none" stroke="url(#goldV)" stroke-width="18"/>
  <circle cx="448" cy="268" r="87" fill="#0a0a0a"/>
  <line x1="502" y1="332" x2="545" y2="385" stroke="url(#gold)" stroke-width="14" stroke-linecap="round"/>
  <line x1="535" y1="378" x2="556" y2="370" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>

  <!-- Decorative rule -->
  <line x1="220" y1="418" x2="460" y2="418" stroke="#c8a96e" stroke-width="0.6" opacity="0.5"/>

  <!-- MANOEL QUIXABEIRA -->
  <text x="340" y="456" text-anchor="middle"
    font-family="Palatino Linotype, Palatino, Book Antiqua, Georgia, serif"
    font-size="36" font-weight="400" fill="url(#gold)" letter-spacing="8">MANOEL QUIXABEIRA</text>

  <!-- NUTRICIONISTA -->
  <line x1="220" y1="474" x2="296" y2="474" stroke="#c8a96e" stroke-width="0.6" opacity="0.5"/>
  <text x="340" y="478" text-anchor="middle"
    font-family="Inter, Helvetica Neue, Arial, sans-serif"
    font-size="13" font-weight="400" fill="#c8a96e" letter-spacing="7" opacity="0.85">NUTRICIONISTA</text>
  <line x1="384" y1="474" x2="460" y2="474" stroke="#c8a96e" stroke-width="0.6" opacity="0.5"/>

</svg>
